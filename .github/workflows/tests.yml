name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The lock was frozen on 3.12 and does not resolve on 3.9.
      - run: pip install -r requirements-dev.txt ${{ matrix.python-version == '3.12' && '-c requirements-lock.txt' || '' }}
      - run: python -m pytest -q
